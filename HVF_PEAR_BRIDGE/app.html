<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Ebony | Sovereign Telemetry Console</title>
  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-card: #121824;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --font-mono: 'Consolas', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-cyan); }
    .badge-live {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; }
    .metric-value { font-size: 1.5rem; font-weight: 700; font-family: var(--font-mono); color: var(--text-main); }
    .metric-value.cyan { color: var(--accent-cyan); }
    .metric-value.green { color: var(--accent-green); }
    .metric-value.amber { color: var(--accent-amber); }
    .console-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .console-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--text-dim); }
    #log-feed {
      background: #06080d;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      max-height: 420px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-entry { display: flex; gap: 8px; align-items: baseline; word-break: break-all; }
    .log-ts { color: var(--text-dim); font-size: 0.75rem; }
    .log-data { color: var(--accent-cyan); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Project Ebony // Sovereign Telemetry Bridge</h1>
      <div style="font-size: 0.8rem; color: var(--text-dim); margin-top: 4px;" id="feed-key-display">Feed: Initializing...</div>
    </div>
    <span class="badge-live" id="stream-status">Awaiting Feed</span>
  </header>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Subsystem</div>
      <div class="metric-value" id="val-subsystem">--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Bus Voltage</div>
      <div class="metric-value cyan" id="val-voltage">-- V</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Frame Sequence</div>
      <div class="metric-value green" id="val-sequence">#--</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Watchdog Heartbeat</div>
      <div class="metric-value amber" id="val-watchdog">-- ms</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Committed Blocks</div>
      <div class="metric-value" id="val-blocks">0</div>
    </div>
  </div>

  <div class="console-panel">
    <div class="console-title">Live Cryptographic Audit Feed</div>
    <div id="log-feed"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
