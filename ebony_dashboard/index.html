<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebony Executive Dashboard</title>
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; }
        h2 { border-bottom: 1px solid #00ffcc; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        #chat-container { width: 100%; max-width: 800px; margin: 0 auto; }
        #chat-box { height: 500px; overflow-y: auto; background: #0a0a0a; border: 1px solid #333; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0, 255, 204, 0.1); }
        .input-group { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 15px; background: #111; color: #00ffcc; border: 1px solid #333; outline: none; font-size: 16px; }
        button { padding: 15px 30px; background: #00ffcc; color: #000; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover { background: #00ccaa; }
        .sys-msg { color: #888; font-style: italic; margin-bottom: 10px; font-size: 14px;}
        .user-msg { color: #fff; margin-bottom: 10px; }
        .ebony-msg { color: #00ffcc; margin-bottom: 20px; border-left: 2px solid #00ffcc; padding-left: 10px;}
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>Ebony // Tactical Comm Link</h2>
        <div id="chat-box">
            <div class="sys-msg">System Online. Dashboard ready for executive directives.</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Enter executive directive..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Transmit</button>
        </div>
    </div>

    <script>
        // Force asynchronous halt until hardware GPS is locked
        function getSecureCoordinates() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve({lat: null, lon: null});
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve({lat: pos.coords.latitude, lon: pos.coords.longitude}),
                        (err) => resolve({lat: null, lon: null}),
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                }
            });
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += <div class="user-msg"><b>CEO:</b>  + message + </div>;
            input.value = "";

            const loadingId = "load-" + Date.now();
            chatBox.innerHTML += <div id=" + loadingId + " class="sys-msg">Acquiring secure GPS lock...</div>;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Execution freezes here until the GPS chip responds
            const coords = await getSecureCoordinates();

            document.getElementById(loadingId).innerText = "Processing payload...";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, lat: coords.lat, lon: coords.lon })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += <div class="ebony-msg"><b>Ebony:</b>  + data.reply + </div>;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += <div class="sys-msg" style="color:#ff4444;">Transmission Error. Check terminal.</div>;
            }
        }
    </script>
</body>
</html>
