<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVF Ebony Command (Public Edition)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        body { background-color: #000000; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .matrix-container { text-align: center; border: 1px solid #333; padding: 40px; border-radius: 8px; background-color: #111; max-width: 600px; width: 90%; }
        h1 { color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; }
        #widget-zone { margin-top: 20px; color: #888; background: #000; padding: 15px; border-left: 3px solid #333; font-family: monospace; white-space: pre-wrap; text-align: left; }
    </style>
</head>
<body>
    <div class="matrix-container">
        <h1>Ebony Command Active</h1>
        <p>HVF Media Matrix - Public Architecture Showcase</p>
        <div id="widget-zone">Intercepting data stream...</div>
    </div>
    <script>
        function fetchIntel() {
            fetch('data/stream.json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('widget-zone').innerText = "STATUS: " + data.status + "\n\nPAYLOAD:\n" + data.intel;
                })
                .catch(err => {
                    document.getElementById('widget-zone').innerText = "[REDACTED: Awaiting sanitized data]";
                });
        }
        fetchIntel();
    </script>
</body>
</html>
