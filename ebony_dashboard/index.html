<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVF Ebony - Industrial Chief of Staff</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #111827;
            --accent: #10b981;
            --accent-alert: #ef4444;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --border: #1f2937;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 23, 0.96);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
        }
        .auth-card h2 { margin: 0 0 8px 0; color: var(--accent); }
        .auth-card p { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }
        .auth-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #06090f;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        #main-container {
            display: none;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid var(--accent);
        }
        #chat-window {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
        }
        .msg-ceo {
            align-self: flex-end;
            background: #1e293b;
            border-left: 3px solid #3b82f6;
        }
        .msg-ebony {
            align-self: flex-start;
            background: var(--bg-card);
            border-left: 3px solid var(--accent);
        }
        #input-panel {
            padding: 16px 24px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        #user-msg {
            flex: 1;
            padding: 12px 16px;
            border-radius: 6px;
            background: #06090f;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 14px;
        }
        #send-btn {
            padding: 12px 24px;
            border-radius: 6px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="auth-modal">
        <div class="auth-card">
            <h2>HVF Security Gateway</h2>
            <p>Enter Sovereign Executive Passphrase to unlock Ebony</p>
            <input type="password" id="passphrase-input" class="auth-input" placeholder="Passphrase..." />
            <button class="auth-btn" onclick="authenticate()">Unlock Node</button>
            <div id="auth-err" style="color: var(--accent-alert); font-size: 12px; margin-top: 12px;"></div>
        </div>
    </div>

    <div id="main-container">
        <header>
            <div>
                <strong style="font-size: 16px;">Humphrey Virtual Farm</strong> | Ebony Chief of Staff
            </div>
            <div class="status-badge" id="telemetry-badge">OPSEC Gated - Secure</div>
        </header>
        <div id="chat-window">
            <div class="message msg-ebony">
                Sovereign Node Authenticated. Knowledge Vault memory and telemetry streams ready. Standing by for directives.
            </div>
        </div>
        <div id="input-panel">
            <input type="text" id="user-msg" placeholder="Transmit directive to Ebony..." onkeydown="if(event.key==='Enter') sendDirective()" />
            <button id="send-btn" onclick="sendDirective()">Transmit</button>
        </div>
    </div>

    <script>
        let authToken = null;
        let coords = { lat: null, lon: null };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { coords.lat = pos.coords.latitude; coords.lon = pos.coords.longitude; },
                () => { console.log('Location standby'); }
            );
        }

        async function authenticate() {
            const pass = document.getElementById('passphrase-input').value;
            const errDiv = document.getElementById('auth-err');
            errDiv.innerText = '';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passphrase: pass })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('main-container').style.display = 'flex';
                } else {
                    errDiv.innerText = data.message || 'Access Denied';
                }
            } catch (err) {
                errDiv.innerText = 'Gateway Connection Error';
            }
        }

        async function sendDirective() {
            const input = document.getElementById('user-msg');
            const msg = input.value.trim();
            if (!msg || !authToken) return;

            const chat = document.getElementById('chat-window');
            chat.innerHTML += <div class="message msg-ceo"></div>;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': Bearer 
                    },
                    body: JSON.stringify({ message: msg, lat: coords.lat, lon: coords.lon })
                });
                const data = await res.json();
                chat.innerHTML += <div class="message msg-ebony"></div>;
                chat.scrollTop = chat.scrollHeight;
            } catch (err) {
                chat.innerHTML += <div class="message msg-ebony" style="color:var(--accent-alert);">Transmission failed: </div>;
            }
        }
    </script>
</body>
</html>
