<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVF Media Matrix | Executive Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>PROJECT EBONY NEXUS</h1>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="status-text">SYSTEM ACTIVE</span>
            </div>
        </div>
        
        <div class="grid-layout">
            <div class="content-panel">
                <h3 class="panel-title">LATEST INTELLIGENCE PAYLOAD</h3>
                <div id="intel-display" class="intel-feed">Awaiting data stream...</div>
            </div>
            
            <div class="content-panel comm-panel">
                <h3 class="panel-title">EBONY COMM LINK</h3>
                <div id="chat-history" class="chat-feed">
                    <div class="chat-msg ebony"><strong>Ebony:</strong> Secure Comm Link Established. Standing by for executive directives.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Enter executive directive..." autocomplete="off">
                    <button id="send-btn">TRANSMIT</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
